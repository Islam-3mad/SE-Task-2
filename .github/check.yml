name: Check Repository

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run main application check
        run: |
          if [ -f "main.py" ]; then
            python main.py
          else
            echo "main.py not found!"
            exit 1
          fi
